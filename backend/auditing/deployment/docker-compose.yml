version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    environment:
      - APP_ENV=development
      - DATABASE_URL=sqlite:///./data/sonar_x.db
      - UPLOAD_DIR=./data/uploads
      - PROCESSED_DIR=./data/processed
      - REPORT_DIR=./data/reports
      - MODEL_DIR=./models
      - MODEL_PROVIDER=demo
      - CONFIDENCE_THRESHOLD=0.5
      - CORS_ORIGINS=["http://localhost:5173", "http://127.0.0.1:5173"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
