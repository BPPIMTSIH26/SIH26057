services:
  # ============================================================================
  # SagarNetra FastAPI Backend Service
  # ============================================================================
  - type: web
    name: sagarnetra-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///./data/sonar_x.db
      - key: UPLOAD_DIR
        value: ./data/uploads
      - key: PROCESSED_DIR
        value: ./data/processed
      - key: REPORT_DIR
        value: ./data/reports
      - key: MODEL_DIR
        value: ./models
      - key: MODEL_PROVIDER
        value: demo
      - key: CONFIDENCE_THRESHOLD
        value: "0.5"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["*"]'

  # NOTE: Frontend (Static Site) must be deployed manually via Render Dashboard.
  # Render Blueprint YAML does not support type:static.
  # See README for manual frontend deployment steps.
