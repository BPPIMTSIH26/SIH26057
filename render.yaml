services:
  # ============================================================================
  # SagarNetra FastAPI Backend Service
  # ============================================================================
  - type: web
    name: sagarnetra-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///./data/sonar_x.db
      - key: UPLOAD_DIR
        value: ./data/uploads
      - key: PROCESSED_DIR
        value: ./data/processed
      - key: REPORT_DIR
        value: ./data/reports
      - key: MODEL_DIR
        value: ./models
      - key: MODEL_PROVIDER
        value: demo
      - key: CONFIDENCE_THRESHOLD
        value: "0.5"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["*"]'

  # ============================================================================
  # SagarNetra React/Vite Frontend (Static Site)
  # ============================================================================
  - type: static
    name: sagarnetra-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        fromService:
          type: web
          name: sagarnetra-backend
          property: url
